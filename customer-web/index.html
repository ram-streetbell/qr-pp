<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table Order</title><style>body{margin:0;background:#f6f6f7;font-family:Arial,sans-serif;color:#18181b}header{background:#fff;padding:18px;position:sticky;top:0;border-bottom:1px solid #ddd}main{max-width:720px;margin:auto;padding:12px 16px 100px}.item{background:#fff;padding:16px;border-radius:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.info{flex:1}.item h3{margin:0 0 6px}.item p{color:#71717a;margin:0 0 8px;font-size:13px}.item button,footer button{background:#18181b;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.modal>div{background:#fff;padding:25px;border-radius:18px;max-width:350px;text-align:center}</style></head><body><div id="app">Loading…</div><script>const API=localStorage.getItem('QRPP_API')||'http://localhost:8080';const raw=location.pathname.split('/').filter(Boolean).pop();let items=[],cart={};const app=document.getElementById('app');async function init(){try{const r=await fetch(`${API}/api/public/session/${raw}`);const x=await r.json();if(!r.ok)throw Error(x.error||'QR is inactive');items=x.items;render(x)}catch(e){app.innerHTML=`<main><h1>QR unavailable</h1><p>${e.message}</p><p>Please ask staff for a new QR.</p></main>`}}function render(session){const cats=[...new Set(items.map(x=>x.category))];app.innerHTML=`<header><b>Table ${session.table.number}</b><div style="font-size:12px;color:#71717a;margin-top:4px">Scan-to-order</div></header><main>${cats.map(c=>`<h2>${c}</h2>${items.filter(x=>x.category===c).map(i=>`<div class="item"><div class="info"><h3>${i.name}</h3><p>${i.description||''}</p><b>₹${i.price}</b></div><button onclick="add('${i.id}')">Add</button>${cart[i.id]?`<b>${cart[i.id]}</b>`:''}</div>`).join('')}`).join('')}</main><footer><b>₹${total()}</b><button onclick="place()" ${total()?'':'disabled'}>Place order</button></footer>`}function add(id){cart[id]=(cart[id]||0)+1;fetchSession()}function total(){return items.reduce((s,i)=>s+i.price*(cart[i.id]||0),0)}async function fetchSession(){const r=await fetch(`${API}/api/public/session/${raw}`);const x=await r.json();if(r.ok)render(x)}async function place(){const body={items:Object.entries(cart).map(([menuItemId,quantity])=>({menuItemId,quantity}))};const r=await fetch(`${API}/api/public/session/${raw}/orders`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)return alert(x.message||x.error);cart={};render(await (await fetch(`${API}/api/public/session/${raw}`)).json());alert(`Order sent. KOT: ${x.order.kotNumber}`)}init();</script></body></html>
