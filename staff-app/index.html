<!doctype html><html><head><meta charset="utf-8"><title>QR-PP Staff</title><style>body{margin:0;font-family:Arial;background:#f4f4f5;color:#18181b}header{background:#111827;color:#fff;padding:18px 24px}main{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}.card.active{border:2px solid #16a34a}.card h2{margin:0 0 8px}.status{font-size:12px;color:#71717a;margin-bottom:14px}.button{border:0;background:#111827;color:white;padding:10px 12px;border-radius:9px;cursor:pointer;margin:3px}.danger{background:#dc2626}.qr{max-width:280px;display:block;margin:15px auto}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.modalbox{background:#fff;border-radius:18px;padding:24px;min-width:360px;text-align:center}.close{float:right;border:0;background:none;font-size:20px}</style></head><body><header><h1>QR-PP Table Manager</h1></header><main><div id="grid">Loading…</div></main><div id="modal"></div><script>const API='http://localhost:8080';let tables=[];async function load(){const r=await fetch(API+'/api/tables');tables=(await r.json()).tables;render()}function render(){document.getElementById('grid').innerHTML='<div class="grid">'+tables.map(t=>`<div class="card ${t.status==='active'?'active':''}"><h2>Table ${t.number}</h2><div class="status">${t.status.toUpperCase()}</div>${t.status==='active'?'<button class="button danger" onclick="closeTable(\''+t.id+'\')">Close QR</button>':'<button class="button" onclick="createQr(\''+t.id+'\')">Generate QR</button>'}</div>`).join('')+'</div>'}async function createQr(id){const r=await fetch(API+'/api/tables/'+id+'/session',{method:'POST'});const x=await r.json();if(!r.ok)return alert(x.error);localStorage.setItem('qrpp-'+id,JSON.stringify({id:x.sessionId}));document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="document.getElementById('modal').innerHTML=''">×</button><h2>Table ${x.table.number}</h2><img class="qr" src="${x.qrDataUrl}"><p>Give this temporary QR to the customer.</p><small>${x.url}</small><br><button class="button" onclick="window.print()">Print QR</button><button class="button" onclick="document.getElementById('modal').innerHTML=''">Done</button></div></div>`;load()}async function closeTable(id){if(!confirm('Close this table QR? The printed QR will stop working immediately.'))return;const active=JSON.parse(localStorage.getItem('qrpp-'+id)||'null');if(!active)return alert('Session not found on this computer');const r=await fetch(API+'/api/sessions/'+active.id+'/close',{method:'POST'});if(!r.ok)return alert('Could not close session');localStorage.removeItem('qrpp-'+id);load()}load();</script></body></html>
